[install]
saveTextLockfile = true
# 7-day supply-chain guard: skip package versions published less than 7 days ago.
minimumReleaseAge = 604800
# Each entry bypasses the 7-day guard for one package — confirm with the user
# before adding any.
minimumReleaseAgeExcludes = ["@lovable.dev/vite-tanstack-config", "@lovable.dev/email-js", "@lovable.dev/webhooks-js"]
