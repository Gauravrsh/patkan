<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Patkan settings</title>
    <style>
      body {
        margin: 0 auto;
        padding: 32px 24px;
        max-width: 620px;
        background: #fffaf3;
        color: #2c2119;
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      h1 { font-size: 20px; letter-spacing: -0.01em; }
      label { display: block; margin: 18px 0 6px; font-weight: 550; }
      input[type="text"], select {
        width: 100%;
        padding: 9px 10px;
        border: 1px solid rgba(120, 90, 60, 0.24);
        border-radius: 10px;
        background: #fff;
        font: inherit;
      }
      .muted { color: #7c6a58; font-size: 12px; }
      .check { display: flex; gap: 8px; align-items: flex-start; margin-top: 18px; }
      button {
        margin-top: 22px;
        border: 1px solid #c2521a;
        background: #c2521a;
        color: #fff;
        border-radius: 10px;
        padding: 9px 16px;
        font: 500 13px/1 inherit;
        cursor: pointer;
      }
      #saved { margin-left: 10px; color: #7c6a58; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>✦ Patkan settings</h1>

    <label for="persona">Default persona</label>
    <select id="persona"></select>

    <label for="apiBase">Patkan server</label>
    <input id="apiBase" type="text" spellcheck="false" />
    <p class="muted">Leave as-is unless you self-host.</p>

    <div class="check">
      <input id="zero" type="checkbox" />
      <label for="zero" style="margin: 0; font-weight: 400">
        Ghost mode only — never attach my account to a transform.
        <span class="muted">Usage is still counted per device.</span>
      </label>
    </div>

    <div>
      <button id="save">Save</button><span id="saved"></span>
    </div>

    <p class="muted" style="margin-top: 28px">
      Patkan sends the text you transform to its server and on to a model to be rewritten. Prompts are
      not stored. Usage is a per-day count tied to an anonymous device id or your account.
    </p>

    <script type="module" src="options.js"></script>
  </body>
</html>
